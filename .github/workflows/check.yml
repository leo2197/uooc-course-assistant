name: Windows checks
on: [push, pull_request]
jobs:
  check:
    runs-on: windows-latest
    env:
      UOOC_USERNAME: fixture
      UOOC_PASSWORD: fixture
      LLM_API_KEY: fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:browser
      - run: npm run check
